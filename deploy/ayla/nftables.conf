#!/usr/sbin/nft -f

# `destroy` is idempotent and the whole nft input is one netlink transaction.
# Replace only Ayla's table; Docker remains the owner of its filter/NAT tables.
destroy table inet ayla_filter

define cloudflare_ipv4 = {
	173.245.48.0/20,
	103.21.244.0/22,
	103.22.200.0/22,
	103.31.4.0/22,
	141.101.64.0/18,
	108.162.192.0/18,
	190.93.240.0/20,
	188.114.96.0/20,
	197.234.240.0/22,
	198.41.128.0/17,
	162.158.0.0/15,
	104.16.0.0/13,
	104.24.0.0/14,
	172.64.0.0/13,
	131.0.72.0/22
}

define cloudflare_ipv6 = {
	2400:cb00::/32,
	2606:4700::/32,
	2803:f800::/32,
	2405:b500::/32,
	2405:8100::/32,
	2a06:98c0::/29,
	2c0f:f248::/32
}

table inet ayla_filter {
	chain input {
		type filter hook input priority filter; policy drop;

		ct state invalid drop
		ct state established,related accept
		iifname "lo" accept

		ip protocol icmp accept
		ip6 nexthdr ipv6-icmp accept

		tcp dport 22 accept
		ip saddr $cloudflare_ipv4 tcp dport { 80, 443 } accept
		ip6 saddr $cloudflare_ipv6 tcp dport { 80, 443 } accept
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
