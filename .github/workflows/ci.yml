name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    uses: sf0rzin/ci/.github/workflows/rust-windows.yml@main
    with:
      tauri: true
      manifest-dir: src-tauri
      # start lenient so the pipeline goes green first; tighten later:
      fmt: false
      clippy: false
      tests: true
