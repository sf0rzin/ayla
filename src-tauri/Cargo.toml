[package]
name = "ayla"
version = "0.1.0"
description = "Ayla desktop application"
authors = ["Ayla contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ayla_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
url = "2"
ureq = { version = "3.3", features = ["socks-proxy"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wreq = { version = "=6.0.0-rc.29", features = ["brotli", "cookies", "deflate", "gzip", "json", "socks", "stream", "zstd"] }
wreq-util = { version = "=3.0.0-rc.14", features = ["emulation-compression", "tokio-rt"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
