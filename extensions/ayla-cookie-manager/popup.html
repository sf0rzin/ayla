<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayla Cookie Manager</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body class="popup-body">
    <main class="popup-shell">
      <header class="brand-row">
        <div class="brand-mark">A</div>
        <div><strong>Ayla</strong><span>Cookie Manager</span></div>
        <span class="status-dot" title="Dados processados localmente"></span>
      </header>

      <section class="site-card">
        <span class="eyebrow">SITE ATUAL</span>
        <div class="site-heading">
          <div class="site-favicon" id="site-favicon">•</div>
          <div><strong id="site-name">Carregando…</strong><span id="site-url">Aguardando a aba ativa</span></div>
          <span class="count-pill" id="cookie-count">0</span>
        </div>
      </section>

      <div class="popup-actions">
        <button class="primary" id="open-manager">Gerenciar cookies</button>
        <button id="delete-site">Apagar cookies não protegidos</button>
        <button id="clear-storage">Limpar LocalStorage deste site</button>
      </div>

      <footer><span id="message">Tudo acontece localmente.</span><button id="refresh" title="Atualizar">↻</button></footer>
    </main>
    <script src="preview-mock.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
